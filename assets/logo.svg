<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background Circle -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a365d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f1419;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d4af37;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#bgGradient)" stroke="#c9a227" stroke-width="3"/>
  
  <!-- Greek Column Top -->
  <rect x="60" y="55" width="80" height="8" rx="2" fill="url(#accentGradient)"/>
  
  <!-- Greek Column Shaft -->
  <rect x="75" y="63" width="50" height="70" fill="none" stroke="#c9a227" stroke-width="2" opacity="0.6"/>
  
  <!-- Spiral Decorations -->
  <path d="M75 70 Q85 80, 100 75 Q115 70, 125 80" fill="none" stroke="#c9a227" stroke-width="2"/>
  <path d="M75 100 Q85 110, 100 105 Q115 100, 125 110" fill="none" stroke="#c9a227" stroke-width="2"/>
  <path d="M75 120 Q85 130, 100 125 Q115 120, 125 130" fill="none" stroke="#c9a227" stroke-width="2"/>
  
  <!-- Book/Scroll Icon -->
  <path d="M85 90 L115 90 L110 110 L90 110 Z" fill="#c9a227" opacity="0.8"/>
  <line x1="100" y1="90" x2="100" y2="110" stroke="#1a365d" stroke-width="2"/>
  
  <!-- Text: P (Greek Pi style) -->
  <text x="100" y="155" font-family="Georgia, serif" font-size="28" fill="#c9a227" text-anchor="middle" font-weight="bold">φ</text>
  
  <!-- Small Stars -->
  <circle cx="45" cy="70" r="2" fill="#c9a227"/>
  <circle cx="155" cy="70" r="2" fill="#c9a227"/>
  <circle cx="50" cy="130" r="1.5" fill="#c9a227"/>
  <circle cx="150" cy="130" r="1.5" fill="#c9a227"/>
</svg>
